name: Build Android APK Automatically

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto Generate Buddy Project Files
      run: |
        echo "Creating complete project files automatically..."
        
        # 1. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "BuddyAssistant"
        include ':app'
        EOF

        # 2. build.gradle (Root)
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # 3. gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        # Create directories
        mkdir -p app/src/main/java/com/example/buddyassistant
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 4. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.buddyassistant'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.buddyassistant"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

        # 5. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_btn_speak_now"
                android:label="Buddy Assistant"
                android:supportsRtl="true"
                android:theme="@style/Theme.BuddyAssistant">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".BuddyVoiceService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="microphone" />
            </application>
        </manifest>
        EOF

        # 6. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/example/buddyassistant/MainActivity.java
        package com.example.buddyassistant;

        import android.Manifest;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.os.Build;
        import android.os.Bundle;
        import android.view.View;
        import android.widget.Button;
        import android.widget.TextView;
        import android.widget.Toast;
        import androidx.annotation.NonNull;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;
        import java.util.ArrayList;
        import java.util.List;

        public class MainActivity extends AppCompatActivity {
            private static final int PERMISSION_REQ_CODE = 101;
            private TextView statusTextView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                statusTextView = findViewById(R.id.statusTextView);
                Button startServiceButton = findViewById(R.id.startServiceButton);

                startServiceButton.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        if (checkAndRequestPermissions()) {
                            startBuddyService();
                        }
                    }
                });
            }

            private boolean checkAndRequestPermissions() {
                List<String> permissions = new ArrayList<>();
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    permissions.add(Manifest.permission.RECORD_AUDIO);
                }
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                        permissions.add(Manifest.permission.POST_NOTIFICATIONS);
                    }
                }
                if (!permissions.isEmpty()) {
                    ActivityCompat.requestPermissions(this, permissions.toArray(new String[0]), PERMISSION_REQ_CODE);
                    return false;
                }
                return true;
            }

            private void startBuddyService() {
                Intent serviceIntent = new Intent(this, BuddyVoiceService.class);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    startForegroundService(serviceIntent);
                } else {
                    startService(serviceIntent);
                }
                statusTextView.setText("Status: Buddy Service Active (Listening...)");
                Toast.makeText(this, "Buddy Assistant started successfully!", Toast.LENGTH_SHORT).show();
            }

            @Override
            public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                if (requestCode == PERMISSION_REQ_CODE) {
                    startBuddyService();
                }
            }
        }
        EOF

        # 7. BuddyVoiceService.java
        cat << 'EOF' > app/src/main/java/com/example/buddyassistant/BuddyVoiceService.java
        package com.example.buddyassistant;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.IBinder;
        import android.os.Looper;
        import android.provider.MediaStore;
        import android.speech.RecognitionListener;
        import android.speech.RecognizerIntent;
        import android.speech.SpeechRecognizer;
        import android.widget.Toast;
        import androidx.core.app.NotificationCompat;
        import java.util.ArrayList;
        import java.util.Locale;

        public class BuddyVoiceService extends Service {
            private SpeechRecognizer speechRecognizer;
            private Intent speechIntent;
            private static final String CHANNEL_ID = "BuddyVoiceChannel";
            private Handler handler;

            @Override
            public void onCreate() {
                super.onCreate();
                handler = new Handler(Looper.getMainLooper());
                createNotificationChannel();
                startForeground(1, createNotification());
                initSpeech();
            }

            private void initSpeech() {
                if (!SpeechRecognizer.isRecognitionAvailable(this)) return;

                speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                speechIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault());

                speechRecognizer.setRecognitionListener(new RecognitionListener() {
                    @Override
                    public void onResults(Bundle results) {
                        ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                        if (matches != null && !matches.isEmpty()) {
                            for (String text : matches) {
                                String lower = text.toLowerCase(Locale.ROOT);
                                if (lower.contains("buddy") || lower.contains("badi") || lower.contains("بڈی")) {
                                    handleCommand(lower);
                                    break;
                                }
                            }
                        }
                        restart();
                    }

                    @Override
                    public void onError(int error) {
                        restart();
                    }

                    @Override public void onReadyForSpeech(Bundle params) {}
                    @Override public void onBeginningOfSpeech() {}
                    @Override public void onRmsChanged(float rmsdB) {}
                    @Override public void onBufferReceived(byte[] buffer) {}
                    @Override public void onEndOfSpeech() {}
                    @Override public void onPartialResults(Bundle partialResults) {}
                    @Override public void onEvent(int eventType, Bundle params) {}
                });

                speechRecognizer.startListening(speechIntent);
            }

            private void restart() {
                handler.postDelayed(new Runnable() {
                    @Override
                    public void run() {
                        try {
                            if (speechRecognizer != null) {
                                speechRecognizer.cancel();
                                speechRecognizer.startListening(speechIntent);
                            }
                        } catch (Exception ignored) {}
                    }
                }, 500);
            }

            private void handleCommand(String command) {
                if (command.contains("whatsapp") || command.contains("واٹس ایپ")) {
                    launchPackage("com.whatsapp");
                } else if (command.contains("youtube") || command.contains("یوٹیوب")) {
                    launchPackage("com.google.android.youtube");
                } else if (command.contains("facebook") || command.contains("فیس بک")) {
                    launchPackage("com.facebook.katana");
                } else if (command.contains("chrome") || command.contains("browser") || command.contains("کروم")) {
                    launchPackage("com.android.chrome");
                } else if (command.contains("camera") || command.contains("کیمرہ")) {
                    Intent intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                    intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    startActivity(intent);
                } else if (command.contains("dialer") || command.contains("phone") || command.contains("call") || command.contains("فون")) {
                    Intent intent = new Intent(Intent.ACTION_DIAL);
                    intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    startActivity(intent);
                }
            }

            private void launchPackage(String packageName) {
                PackageManager pm = getPackageManager();
                Intent launchIntent = pm.getLaunchIntentForPackage(packageName);
                if (launchIntent != null) {
                    launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    startActivity(launchIntent);
                }
            }

            private Notification createNotification() {
                return new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setContentTitle("Buddy Assistant Active")
                        .setContentText("Listening for 'Buddy' commands 24/7...")
                        .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                        .setPriority(NotificationCompat.PRIORITY_LOW)
                        .setOngoing(true)
                        .build();
            }

            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                            CHANNEL_ID,
                            "Buddy Voice Service",
                            NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) manager.createNotificationChannel(channel);
                }
            }

            @Override public int onStartCommand(Intent intent, int flags, int startId) { return START_STICKY; }
            @Override public void onDestroy() { if (speechRecognizer != null) speechRecognizer.destroy(); super.onDestroy(); }
            @Override public IBinder onBind(Intent intent) { return null; }
        }
        EOF

        # 8. Resources
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:gravity="center"
            android:orientation="vertical"
            android:padding="24dp">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Buddy Voice Assistant"
                android:textSize="24sp"
                android:textStyle="bold"
                android:layout_marginBottom="16dp" />
            <TextView
                android:id="@+id/statusTextView"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Status: Ready to activate"
                android:textSize="16sp"
                android:layout_marginBottom="24dp" />
            <Button
                android:id="@+id/startServiceButton"
                android:layout_width="match_parent"
                android:layout_height="60dp"
                android:text="START 24/7 BUDDY ASSISTANT" />
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Buddy Assistant</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/colors.xml
        <resources>
            <color name="purple_500">#FF6200EE</color>
            <color name="purple_700">#FF3700B3</color>
            <color name="teal_200">#FF03DAC5</color>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources xmlns:tools="http://schemas.android.com/tools">
            <style name="Theme.BuddyAssistant" parent="Theme.MaterialComponents.DayNight.DarkActionBar">
                <item name="colorPrimary">@color/purple_5
 - name: Build APK with Gradle
      run: |
        gradle wrapper
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Buddy-VoiceControl-APK
        path: app/build/outputs/apk/debug/*.apk
