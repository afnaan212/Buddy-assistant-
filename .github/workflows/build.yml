name: Build Android APK Automatically

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Extract Project Files
      run: |
        for f in *.zip; do
          [ -e "$f" ] && unzip -o "$f" || true
        done

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Ensure Executable Permissions
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew || true

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Buddy-VoiceControl-APK
        path: app/build/outputs/apk/debug/*.apk
