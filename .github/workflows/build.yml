name: Build Android APK Automatically

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Generate Complete Android Project
      run: |
        mkdir -p app/src/main/java/com/example/buddyassistant
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 1. settings.gradle
        cat << 'EOF_SETTINGS' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "BuddyAssistant"
        include ':app'
        EOF_SETTINGS

        # 2. build.gradle (Root)
        cat << 'EOF_BUILD' > build.gradle
        plugins {
            id 'com.android.application' version '8.4.1' apply false
        }
        EOF_BUILD

        # 3. gradle.properties
        cat << 'EOF_PROPS' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF_PROPS

        # 4. app/build.gradle
        cat << 'EOF_APP_BUILD' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.buddyassistant'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.buddyassistant"
                minSdk 24
                targetSdk 34
                versionCode 4
                versionName "4.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }

            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF_APP_BUILD

        # 5. AndroidManifest.xml
        cat << 'EOF_MANIFEST' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-feature android:name="android.hardware.camera.flash" android:required="false" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_btn_speak_now"
                android:label="Buddy Assistant"
                android:supportsRtl="true"
                android:theme="@style/AppTheme">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".BuddyVoiceService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="microphone" />
            </application>
        </manifest>
        EOF_MANIFEST

        # 6. MainActivity.java
        cat << 'EOF_MAIN' > app/src/main/java/com/example/buddyassistant/MainActivity.java
        package com.example.buddyassistant;

        import android.Manifest;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.os.Build;
        import android.os.Bundle;
        import android.view.View;
        import android.widget.Button;
        import android.widget.TextView;
        import android.widget.Toast;
        import androidx.annotation.NonNull;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;
        import java.util.ArrayList;
        import java.util.List;

        public class MainActivity extends AppCompatActivity {
            private static final int PERMISSION_REQ_CODE = 101;
            private TextView statusTextView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                statusTextView = findViewById(R.id.statusTextView);
                Button startServiceButton = findViewById(R.id.startServiceButton);

                startServiceButton.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        if (checkPermissions()) {
                            startBuddyService();
                        }
                    }
                });
            }

            private boolean checkPermissions() {
                List<String> list = new ArrayList<>();
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    list.add(Manifest.permission.RECORD_AUDIO);
                }
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                        list.add(Manifest.permission.POST_NOTIFICATIONS);
                    }
                }
                if (!list.isEmpty()) {
                    ActivityCompat.requestPermissions(this, list.toArray(new String[0]), PERMISSION_REQ_CODE);
                    return false;
                }
                return true;
            }

            private void startBuddyService() {
                Intent serviceIntent = new Intent(this, BuddyVoiceService.class);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    startForegroundService(serviceIntent);
                } else {
                    startService(serviceIntent);
                }
                statusTextView.setText("Status: Buddy Assistant Active & Listening");
                Toast.makeText(this, "Buddy Assistant چالو ہو گیا ہے!", Toast.LENGTH_SHORT).show();
            }

            @Override
            public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                if (requestCode == PERMISSION_REQ_CODE) {
                    boolean allGranted = true;
                    for (int res : grantResults) {
                        if (res != PackageManager.PERMISSION_GRANTED) {
                            allGranted = false;
                            break;
                        }
                    }
                    if (allGranted) {
                        startBuddyService();
                    } else {
                        Toast.makeText(this, "مائیک اور نوٹیفکیشن پرمیشن دینا لازمی ہے", Toast.LENGTH_LONG).show();
                    }
                }
            }
        }
        EOF_MAIN

        # 7. BuddyVoiceService.java
        cat << 'EOF_SERVICE' > app/src/main/java/com/example/buddyassistant/BuddyVoiceService.java
        package com.example.buddyassistant;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Context;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.hardware.camera2.CameraManager;
        import android.media.AudioManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.IBinder;
        import android.os.Looper;
        import android.os.VibrationEffect;
        import android.os.Vibrator;
        import android.provider.MediaStore;
        import android.provider.Settings;
        import android.provider.Telephony;
        import android.speech.RecognitionListener;
        import android.speech.RecognizerIntent;
        import android.speech.SpeechRecognizer;
        import android.speech.tts.TextToSpeech;
        import android.speech.tts.UtteranceProgressListener;
        import androidx.core.app.NotificationCompat;
        import java.util.ArrayList;
        import java.util.Locale;

        public class BuddyVoiceService extends Service {
            private SpeechRecognizer speechRecognizer;
            private Intent speechIntent;
            private static final String CHANNEL_ID = "BuddyVoiceChannel";
            private Handler handler;
            private AudioManager audioManager;
            private TextToSpeech tts;
            private Vibrator vibrator;

            private boolean isTorchOn = false;
            private boolean isListening = false;
            private boolean isSpeaking = false;
            private int userMusicVolume = -1;
            private boolean isTemporarilyMuted = false;
            private long wakeWordTimestamp = 0;
            private int continuousErrorCount = 0;

            @Override
            public void onCreate() {
                super.onCreate();
                handler = new Handler(Looper.getMainLooper());
                audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                createNotificationChannel();

                if (Build.VERSION.SDK_INT >= 34) {
                    startForeground(1, createNotification("Buddy Assistant Active", "Listening for commands quietly..."),
                            android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                } else {
                    startForeground(1, createNotification("Buddy Assistant Active", "Listening for commands quietly..."));
                }

                saveCurrentVolume();
                initTTS();
                initSpeechIntent();
                initRecognizer();
                startListening();
            }

            private void saveCurrentVolume() {
                try {
                    if (audioManager != null) {
                        int vol = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC);
                        if (vol > 0) {
                            userMusicVolume = vol;
                        } else {
                            int max = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                            userMusicVolume = Math.max(max * 2 / 3, 5);
                        }
                    }
                } catch (Exception ignored) {}
            }

            private void muteBeep() {
                try {
                    if (audioManager != null) {
                        int current = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC);
                        if (current > 0) {
                            userMusicVolume = current;
                        }
                        audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, 0, 0);
                        isTemporarilyMuted = true;
                    }
                } catch (Exception ignored) {}
            }

            private void restoreVolume() {
                try {
                    if (audioManager != null && isTemporarilyMuted) {
                        int restore = (userMusicVolume > 0) ? userMusicVolume : (audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC) * 2 / 3);
                        audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, restore, 0);
                        isTemporarilyMuted = false;
                    }
                } catch (Exception ignored) {}
            }

            private void initTTS() {
                try {
                    tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                        @Override
                        public void onInit(int status) {
                            if (status == TextToSpeech.SUCCESS && tts != null) {
                                int res = tts.setLanguage(new Locale("ur", "PK"));
                                if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                                    res = tts.setLanguage(new Locale("hi", "IN"));
                                    if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                                        tts.setLanguage(Locale.US);
                                    }
                                }
                                tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                    @Override
                                    public void onStart(String utteranceId) {
                                        isSpeaking = true;
                                    }

                                    @Override
                                    public void onDone(String utteranceId) {
                                        isSpeaking = false;
                                        scheduleRestart(400);
                                    }

                                    @Override
                                    public void onError(String utteranceId) {
                                        isSpeaking = false;
                                        scheduleRestart(400);
                                    }
                                });
                            }
                        }
                    });
                } catch (Exception ignored) {}
            }

            private void speakResponse(String message) {
                try {
                    restoreVolume();
                    isSpeaking = true;
                    if (speechRecognizer != null) {
                        try { speechRecognizer.cancel(); } catch (Exception ignored) {}
                    }
                    isListening = false;

                    if (tts != null) {
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                            tts.speak(message, TextToSpeech.QUEUE_FLUSH, null, "BUDDY_TTS");
                        } else {
                            tts.speak(message, TextToSpeech.QUEUE_FLUSH, null);
                        }
                    } else {
                        isSpeaking = false;
                        scheduleRestart(500);
                    }
                } catch (Exception e) {
                    isSpeaking = false;
                    scheduleRestart(500);
                }
            }

            private void triggerVibration() {
                try {
                    if (vibrator != null) {
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                            vibrator.vibrate(VibrationEffect.createOneShot(180, VibrationEffect.DEFAULT_AMPLITUDE));
                        } else {
                            vibrator.vibrate(180);
                        }
                    }
                } catch (Exception ignored) {}
            }

            private void initSpeechIntent() {
                speechIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                speechIntent.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());
                speechIntent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5);
                speechIntent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ur-PK");
                speechIntent.putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", new String[]{"en-US", "pa-PK"});
            }

            private void initRecognizer() {
                if (!SpeechRecognizer.isRecognitionAvailable(this)) return;

                try {
                    if (speechRecognizer != null) {
                        try {
                            speechRecognizer.cancel();
                            speechRecognizer.destroy();
                        } catch (Exception ignored) {}
                        speechRecognizer = null;
                    }

                    speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                    speechRecognizer.setRecognitionListener(new RecognitionListener() {
                        @Override
                        public void onReadyForSpeech(Bundle params) {
                            restoreVolume();
                        }

                        @Override
                        public void onBeginningOfSpeech() {
                            restoreVolume();
                        }

                        @Override public void onRmsChanged(float rmsdB) {}
                        @Override public void onBufferReceived(byte[] buffer) {}

                        @Override
                        public void onEndOfSpeech() {
                            restoreVolume();
                        }

                        @Override
                        public void onError(int error) {
                            restoreVolume();
                            isListening = false;
                            long delay = 600;

                            if (error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY || error == SpeechRecognizer.ERROR_CLIENT) {
                                continuousErrorCount++;
                                delay = 1500;
                                if (continuousErrorCount >= 3) {
                                    continuousErrorCount = 0;
                                    initRecognizer();
                                }
                            } else {
                                continuousErrorCount = 0;
                            }

                            scheduleRestart(delay);
                        }

                        @Override
                        public void onResults(Bundle results) {
                            restoreVolume();
                            isListening = false;
                            continuousErrorCount = 0;

                            if (results != null) {
                                ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                if (matches != null && !matches.isEmpty()) {
                                    for (String text : matches) {
                                        if (processVoiceText(text)) {
                                            break;
                                        }
                                    }
                                }
                            }
                            scheduleRestart(600);
                        }

                        @Override
                        public void onPartialResults(Bundle partialResults) {
                            if (partialResults != null && !isSpeaking) {
                                ArrayList<String> matches = partialResults.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                if (matches != null && !matches.isEmpty()) {
                                    for (String text : matches) {
                                        if (hasDefiniteCommand(text)) {
                                            restoreVolume();
                                            if (speechRecognizer != null) {
                                                try { speechRecognizer.cancel(); } catch (Exception ignored) {}
                                            }
                                            isListening = false;
                                            processVoiceText(text);
                                            scheduleRestart(1000);
                                            break;
                                        }
                                    }
                                }
                            }
                        }

                        @Override public void onEvent(int eventType, Bundle params) {}
                    });
                } catch (Exception ignored) {}
            }

            private synchronized void startListening() {
                if (isListening || isSpeaking) return;
                try {
                    if (speechRecognizer == null) {
                        initRecognizer();
                    }
                    if (speechRecognizer != null) {
                        muteBeep();
                        speechRecognizer.startListening(speechIntent);
                        isListening = true;
                    }
                } catch (Exception e) {
                    restoreVolume();
                    isListening = false;
                    scheduleRestart(1000);
                }
            }

            private void scheduleRestart(long delayMillis) {
                if (isSpeaking) return;
                handler.removeCallbacks(restartRunnable);
                handler.postDelayed(restartRunnable, delayMillis);
            }

            private final Runnable restartRunnable = new Runnable() {
                @Override
                public void run() {
                    try {
                        if (speechRecognizer != null) {
                            speechRecognizer.cancel();
                        }
                    } catch (Exception ignored) {}
                    isListening = false;
                    startListening();
                }
            };

            private boolean isWakeWordOnly(String text) {
                String clean = text.trim();
                return clean.equals("buddy") || clean.equals("body") || clean.equals("badi")
                        || clean.equals("baddy") || clean.equals("budy") || clean.equals("bari")
                        || clean.equals("بڈی") || clean.equals("باڈی") || clean.equals("بدی")
                        || clean.equals("بڑی") || clean.equals("بڈھی") || clean.equals("دوست")
                        || clean.equals("یار") || clean.equals("ਯਾਰ") || clean.equals("ਬੱਡੀ")
                        || clean.equals("hello buddy") || clean.equals("hey buddy")
                        || clean.equals("سنو") || clean.equals("بڈی سنو") || clean.equals("باڈی سنو");
            }

            private boolean containsWakeWord(String text) {
                return text.contains("buddy") || text.contains("body") || text.contains("badi")
                        || text.contains("baddy") || text.contains("budy") || text.contains("bari")
                        || text.contains("باڈی") || text.contains("بڈی") || text.contains("بدی")
                        || text.contains("بڑی") || text.contains("بڈھی") || text.contains("دوست")
                        || text.contains("یار") || text.contains("ਯਾਰ") || text.contains("ਬੱਡੀ");
            }

            private boolean isYouTube(String t) {
                return t.contains("youtube") || t.contains("you tube") || t.contains("u tube") || t.contains("yt")
                        || t.contains("یوٹیوب") || t.contains("یو ٹیوب") || t.contains("ویڈیو") || t.contains("ویڈیوز") || t.contains("ਯੂਟਿਊਬ");
            }

            private boolean isWhatsApp(String t) {
                return t.contains("whatsapp") || t.contains("whats app") || t.contains("watsapp") || t.contains("wa")
                        || t.contains("واٹس ایپ") || t.contains("واٹس اپ") || t.contains("واٹساپ") || t.contains("ਵਟਸਐਪ");
            }

            private boolean isMessages(String t) {
                return t.contains("message") || t.contains("messages") || t.contains("sms") || t.contains("inbox")
                        || t.contains("میسج") || t.contains("میسجز") || t.contains("پیغام") || t.contains("پیغامات")
                        || t.contains("ایس ایم ایس") || t.contains("سنیہے") || t.contains("سنیہا") || t.contains("ਸੁਨੇਹੇ") || t.contains("ਮੈਸੇਜ");
            }

            private boolean isCamera(String t) {
                return t.contains("camera") || t.contains("photo") || t.contains("picture") || t.contains("selfie")
                        || t.contains("کیمرہ") || t.contains("کیمرا") || t.contains("تصویر") || t.contains("فوٹو") || t.contains("سیلفی") || t.contains("ਕੈਮਰਾ");
            }

            private boolean isDialer(String t) {
                return t.contains("dialer") || t.contains("phone") || t.contains("call") || t.contains("dial")
                        || t.contains("فون") || t.contains("کال") || t.contains("ڈائلر") || t.contains("ڈائل") || t.contains("ਕਾਲ") || t.contains("ਫੋਨ");
            }

            private boolean isBrowser(String t) {
                return t.contains("chrome") || t.contains("browser") || t.contains("google") || t.contains("internet")
                        || t.contains("کروم") || t.contains("گوگل") || t.contains("براؤزر") || t.contains("انٹرنیٹ") || t.contains("ਕ੍ਰੋਮ");
            }

            private boolean isFacebook(String t) {
                return t.contains("facebook") || t.contains("face book") || t.contains("fb")
                        || t.contains("فیس بک") || t.contains("فیسبک") || t.contains("ਫੇਸਬੁੱਕ");
            }

            private boolean isSettings(String t) {
                return t.contains("setting") || t.contains("settings")
                        || t.contains("سیٹنگ") || t.contains("سیٹنگز") || t.contains("ਸੈਟਿੰਗ");
            }

            private boolean isGallery(String t) {
                return t.contains("gallery") || t.contains("photos") || t.contains("images")
                        || t.contains("گیلری") || t.contains("تصاویر") || t.contains("گالری") || t.contains("ਗੈਲਰੀ");
            }

            private boolean isTorch(String t) {
                return t.contains("torch") || t.contains("flashlight") || t.contains("flash light") || t.contains("light")
                        || t.contains("ٹارچ") || t.contains("لائٹ") || t.contains("بتی") || t.contains("فلیش");
            }

            private boolean hasDefiniteCommand(String t) {
                return isYouTube(t) || isWhatsApp(t) || isMessages(t) || isCamera(t)
                        || isDialer(t) || isBrowser(t) || isFacebook(t) || isSettings(t)
                        || isGallery(t) || isTorch(t);
            }

            private boolean processVoiceText(String rawText) {
                if (rawText == null || rawText.trim().isEmpty()) return false;
                String text = rawText.toLowerCase(Locale.ROOT).trim();

                if (isWakeWordOnly(text)) {
                    wakeWordTimestamp = System.currentTimeMillis();
                    triggerVibration();
                    speakResponse("Ji, main sun raha hoon!");
                    return true;
                }

                // 1. YouTube
                if (isYouTube(text)) {
                    wakeWordTimestamp = 0;
                    speakResponse("Opening YouTube");
                    openYouTube();
                    return true;
                }

                // 2. WhatsApp
                if (isWhatsApp(text)) {
                    wakeWordTimestamp = 0;
                    speakResponse("Opening WhatsApp");
                    launchPackage("com.whatsapp");
                    return true;
                }

                // 3. Messages / SMS
                if (isMessages(text)) {
                    wakeWordTimestamp = 0;
                    speakResponse("Opening Messages");
                    openMessages();
                    return true;
                }

                // 4. Camera
                if (isCamera(text)) {
                    wakeWordTimestamp = 0;
                    speakResponse("Opening Camera");
                    openCamera();
                    return true;
                }

                // 5. Phone / Call
                if (isDialer(text)) {
                    wakeWordTimestamp = 0;
                    speakResponse("Opening Phone");
                    openDialer();
                    return true;
                }

                // 6. Browser / Chrome
                if (isBrowser(text)) {
                    wakeWordTimestamp = 0;
                    speakResponse("Opening Browser");
                    openBrowser();
                    return true;
                }

                // 7. Facebook
                if (isFacebook(text)) {
                    wakeWordTimestamp = 0;
                    speakResponse("Opening Facebook");
                    openFacebook();
                    return true;
                }

                // 8. Settings
                if (isSettings(text)) {
                    wakeWordTimestamp = 0;
                    speakResponse("Opening Settings");
                    openSettings();
                    return true;
                }

                // 9. Gallery
                if (isGallery(text)) {
                    wakeWordTimestamp = 0;
                    speakResponse("Opening Gallery");
                    openGallery();
                    return true;
                }

                // 10. Flashlight / Torch
                if (isTorch(text)) {
                    wakeWordTimestamp = 0;
                    toggleTorch();
                    return true;
                }

                // If wake word was detected with some other phrase
                if (containsWakeWord(text)) {
                    wakeWordTimestamp = System.currentTimeMillis();
                    triggerVibration();
                    speakResponse("Ji, hukam karein?");
                    return true;
                }

                return false;
            }

            private void openYouTube() {
                restoreVolume();
                Intent intent = getPackageManager().getLaunchIntentForPackage("com.google.android.youtube");
                if (intent == null) {
                    intent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com"));
                }
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openMessages() {
                restoreVolume();
                Intent intent = null;
                try {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                        String defaultSms = Telephony.Sms.getDefaultSmsPackage(this);
                        if (defaultSms != null) {
                            intent = getPackageManager().getLaunchIntentForPackage(defaultSms);
                        }
                    }
                } catch (Exception ignored) {}

                if (intent == null) {
                    intent = new Intent(Intent.ACTION_MAIN);
                    intent.addCategory(Intent.CATEGORY_APP_MESSAGING);
                }
                if (intent.resolveActivity(getPackageManager()) == null) {
                    intent = new Intent(Intent.ACTION_VIEW);
                    intent.setData(Uri.parse("sms:"));
                }
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openCamera() {
                restoreVolume();
                Intent intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openDialer() {
                restoreVolume();
                Intent intent = new Intent(Intent.ACTION_DIAL);
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openBrowser() {
                restoreVolume();
                Intent intent = getPackageManager().getLaunchIntentForPackage("com.android.chrome");
                if (intent == null) {
                    intent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com"));
                }
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openFacebook() {
                restoreVolume();
                Intent intent = getPackageManager().getLaunchIntentForPackage("com.facebook.katana");
                if (intent == null) {
                    intent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.facebook.com"));
                }
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openSettings() {
                restoreVolume();
                Intent intent = new Intent(Settings.ACTION_SETTINGS);
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openGallery() {
                restoreVolume();
                Intent intent = new Intent(Intent.ACTION_VIEW);
                intent.setType("image/*");
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void toggleTorch() {
                try {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                        CameraManager cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                        String cameraId = cm.getCameraIdList()[0];
                        isTorchOn = !isTorchOn;
                        cm.setTorchMode(cameraId, isTorchOn);
                        speakResponse(isTorchOn ? "Torch On" : "Torch Off");
                    }
                } catch (Exception ignored) {}
            }

            private void launchPackage(String packageName) {
                restoreVolume();
                Intent launchIntent = getPackageManager().getLaunchIntentForPackage(packageName);
                if (launchIntent != null) {
                    launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    startActivity(launchIntent);
                }
            }

            private Notification createNotification(String title, String content) {
                return new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setContentTitle(title)
                        .setContentText(content)
                        .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                        .setPriority(NotificationCompat.PRIORITY_LOW)
                        .setOngoing(true)
                        .build();
            }

            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                            CHANNEL_ID,
                            "Buddy Voice Service",
                            NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) manager.createNotificationChannel(channel);
                }
            }

            @Override public int onStartCommand(Intent intent, int flags, int startId) { return START_STICKY; }

            @Override
            public void onDestroy() {
                restoreVolume();
                if (speechRecognizer != null) {
                    speechRecognizer.destroy();
                }
                if (tts != null) {
                    tts.stop();
                    tts.shutdown();
                }
                super.onDestroy();
            }

            @Override public IBinder onBind(Intent intent) { return null; }
        }
        EOF_SERVICE

