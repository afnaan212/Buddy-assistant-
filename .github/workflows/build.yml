name: Build Android APK Automatically

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Generate Complete Android Project
      run: |
        mkdir -p app/src/main/java/com/example/buddyassistant
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 1. settings.gradle
        cat << 'EOF_SETTINGS' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "BuddyAssistant"
        include ':app'
        EOF_SETTINGS

        # 2. build.gradle (Root)
        cat << 'EOF_BUILD' > build.gradle
        plugins {
            id 'com.android.application' version '8.4.1' apply false
        }
        EOF_BUILD

        # 3. gradle.properties
        cat << 'EOF_PROPS' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF_PROPS

        # 4. app/build.gradle
        cat << 'EOF_APP_BUILD' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.buddyassistant'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.buddyassistant"
                minSdk 24
                targetSdk 34
                versionCode 3
                versionName "3.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }

            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF_APP_BUILD

        # 5. AndroidManifest.xml
        cat << 'EOF_MANIFEST' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-feature android:name="android.hardware.camera.flash" android:required="false" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_btn_speak_now"
                android:label="Buddy Assistant"
                android:supportsRtl="true"
                android:theme="@style/AppTheme">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".BuddyVoiceService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="microphone" />
            </application>
        </manifest>
        EOF_MANIFEST

        # 6. MainActivity.java
        cat << 'EOF_MAIN' > app/src/main/java/com/example/buddyassistant/MainActivity.java
        package com.example.buddyassistant;

        import android.Manifest;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.os.Build;
        import android.os.Bundle;
        import android.view.View;
        import android.widget.Button;
        import android.widget.TextView;
        import android.widget.Toast;
        import androidx.annotation.NonNull;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;
        import java.util.ArrayList;
        import java.util.List;

        public class MainActivity extends AppCompatActivity {
            private static final int PERMISSION_REQ_CODE = 101;
            private TextView statusTextView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                statusTextView = findViewById(R.id.statusTextView);
                Button startServiceButton = findViewById(R.id.startServiceButton);

                startServiceButton.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        if (checkPermissions()) {
                            startBuddyService();
                        }
                    }
                });
            }

            private boolean checkPermissions() {
                List<String> list = new ArrayList<>();
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    list.add(Manifest.permission.RECORD_AUDIO);
                }
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                        list.add(Manifest.permission.POST_NOTIFICATIONS);
                    }
                }
                if (!list.isEmpty()) {
                    ActivityCompat.requestPermissions(this, list.toArray(new String[0]), PERMISSION_REQ_CODE);
                    return false;
                }
                return true;
            }

            private void startBuddyService() {
                Intent serviceIntent = new Intent(this, BuddyVoiceService.class);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    startForegroundService(serviceIntent);
                } else {
                    startService(serviceIntent);
                }
                statusTextView.setText("Status: Silent Buddy Listener Active");
                Toast.makeText(this, "Buddy Assistant Started (100% Silent Mode)!", Toast.LENGTH_SHORT).show();
            }

            @Override
            public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                if (requestCode == PERMISSION_REQ_CODE) {
                    startBuddyService();
                }
            }
        }
        EOF_MAIN

        # 7. BuddyVoiceService.java
        cat << 'EOF_SERVICE' > app/src/main/java/com/example/buddyassistant/BuddyVoiceService.java
        package com.example.buddyassistant;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Context;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.hardware.camera2.CameraManager;
        import android.media.AudioManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Handler;
        import android.os.IBinder;
        import android.os.Looper;
        import android.os.VibrationEffect;
        import android.os.Vibrator;
        import android.provider.MediaStore;
        import android.provider.Settings;
        import android.provider.Telephony;
        import android.speech.RecognitionListener;
        import android.speech.RecognizerIntent;
        import android.speech.SpeechRecognizer;
        import android.speech.tts.TextToSpeech;
        import androidx.core.app.NotificationCompat;
        import java.util.ArrayList;
        import java.util.Locale;

        public class BuddyVoiceService extends Service {
            private SpeechRecognizer speechRecognizer;
            private Intent speechIntent;
            private static final String CHANNEL_ID = "BuddyVoiceChannel";
            private Handler handler;
            private AudioManager audioManager;
            private TextToSpeech tts;
            private Vibrator vibrator;
            private boolean isTorchOn = false;
            private boolean isListening = false;
            private int savedMusicVolume = -1;

            @Override
            public void onCreate() {
                super.onCreate();
                handler = new Handler(Looper.getMainLooper());
                audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                createNotificationChannel();

                if (Build.VERSION.SDK_INT >= 34) {
                    startForeground(1, createNotification(), android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                } else {
                    startForeground(1, createNotification());
                }

                initTTS();
                initSpeechConfig();
                startSilentListeningLoop();
            }

            private void initTTS() {
                try {
                    tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                        @Override
                        public void onInit(int status) {
                            if (status == TextToSpeech.SUCCESS && tts != null) {
                                tts.setLanguage(Locale.getDefault());
                            }
                        }
                    });
                } catch (Exception ignored) {}
            }

            private void speakResponse(String message) {
                try {
                    restoreAudioVolume();
                    if (tts != null) {
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                            tts.speak(message, TextToSpeech.QUEUE_FLUSH, null, "BUDDY_TTS");
                        } else {
                            tts.speak(message, TextToSpeech.QUEUE_FLUSH, null);
                        }
                    }
                } catch (Exception ignored) {}
            }

            private void triggerVibration() {
                try {
                    if (vibrator != null) {
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                            vibrator.vibrate(VibrationEffect.createOneShot(180, VibrationEffect.DEFAULT_AMPLITUDE));
                        } else {
                            vibrator.vibrate(180);
                        }
                    }
                } catch (Exception ignored) {}
            }

            private void silenceAllAudioStreams() {
                try {
                    if (audioManager != null) {
                        if (savedMusicVolume == -1) {
                            savedMusicVolume = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC);
                        }
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                            audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_MUTE, 0);
                            audioManager.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_MUTE, 0);
                            audioManager.adjustStreamVolume(AudioManager.STREAM_SYSTEM, AudioManager.ADJUST_MUTE, 0);
                        } else {
                            audioManager.setStreamMute(AudioManager.STREAM_MUSIC, true);
                            audioManager.setStreamMute(AudioManager.STREAM_NOTIFICATION, true);
                            audioManager.setStreamMute(AudioManager.STREAM_SYSTEM, true);
                        }
                    }
                } catch (Exception ignored) {}
            }

            private void restoreAudioVolume() {
                try {
                    if (audioManager != null) {
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                            audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_UNMUTE, 0);
                            audioManager.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_UNMUTE, 0);
                            audioManager.adjustStreamVolume(AudioManager.STREAM_SYSTEM, AudioManager.ADJUST_UNMUTE, 0);
                        } else {
                            audioManager.setStreamMute(AudioManager.STREAM_MUSIC, false);
                            audioManager.setStreamMute(AudioManager.STREAM_NOTIFICATION, false);
                            audioManager.setStreamMute(AudioManager.STREAM_SYSTEM, false);
                        }
                        if (savedMusicVolume != -1) {
                            audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, savedMusicVolume, 0);
                            savedMusicVolume = -1;
                        }
                    }
                } catch (Exception ignored) {}
            }

            private void initSpeechConfig() {
                speechIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                speechIntent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5);

                speechIntent.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS, 15000L);
                speechIntent.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 5000L);
                speechIntent.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 5000L);

                if (Build.VERSION.SDK_INT >= 33) {
                    speechIntent.putExtra("android.speech.extra.ENABLE_MULTILANGUAGE", true);
                }
                speechIntent.putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", new String[]{
                    "ur-PK", "pa-PK", "pa-IN", "en-US", "en-PK"
                });
            }

            private void createRecognizerInstance() {
                if (speechRecognizer != null) {
                    try { speechRecognizer.destroy(); } catch (Exception ignored) {}
                    speechRecognizer = null;
                }

                if (!SpeechRecognizer.isRecognitionAvailable(this)) return;

                speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                speechRecognizer.setRecognitionListener(new RecognitionListener() {
                    @Override
                    public void onResults(Bundle results) {
                        isListening = false;
                        ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                        if (matches != null && !matches.isEmpty()) {
                            for (String text : matches) {
                                if (handleVoiceInput(text)) {
                                    break;
                                }
                            }
                        }
                        scheduleNextListening(1500);
                    }

                    @Override
                    public void onError(int error) {
                        isListening = false;
                        if (error == SpeechRecognizer.ERROR_CLIENT || error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) {
                            createRecognizerInstance();
                            scheduleNextListening(3000);
                        } else {
                            scheduleNextListening(1500);
                        }
                    }

                    @Override public void onReadyForSpeech(Bundle params) {}
                    @Override public void onBeginningOfSpeech() {}
                    @Override public void onRmsChanged(float rmsdB) {}
                    @Override public void onBufferReceived(byte[] buffer) {}
                    @Override public void onEndOfSpeech() {}
                    @Override public void onPartialResults(Bundle partialResults) {}
                    @Override public void onEvent(int eventType, Bundle params) {}
                });
            }

            private synchronized void startSilentListeningLoop() {
                if (isListening) return;
                try {
                    silenceAllAudioStreams();
                    if (speechRecognizer == null) {
                        createRecognizerInstance();
                    }
                    if (speechRecognizer != null) {
                        speechRecognizer.startListening(speechIntent);
                        isListening = true;
                    }
                } catch (Exception e) {
                    isListening = false;
                    scheduleNextListening(2000);
                }
            }

            private void scheduleNextListening(long delayMillis) {
                handler.postDelayed(new Runnable() {
                    @Override
                    public void run() {
                        try {
                            if (speechRecognizer != null) {
                                speechRecognizer.cancel();
                            }
                        } catch (Exception ignored) {}
                        isListening = false;
                        startSilentListeningLoop();
                    }
                }, delayMillis);
            }

            private boolean handleVoiceInput(String rawText) {
                if (rawText == null || rawText.trim().isEmpty()) return false;
                String text = rawText.toLowerCase(Locale.ROOT);

                boolean hasWakeWord = text.contains("buddy") || text.contains("badi") || text.contains("baddy")
                        || text.contains("budy") || text.contains("بڈی") || text.contains("بدی")
                        || text.contains("دوست") || text.contains("ਯਾਰ") || text.contains("ਬੱਡੀ");

                if (hasWakeWord) {
                    triggerVibration();

                    // 1. YouTube
                    if (text.contains("youtube") || text.contains("you tube") || text.contains("u tube") || text.contains("yt")
                            || text.contains("یوٹیوب") || text.contains("یو ٹیوب") || text.contains("ویڈیو") || text.contains("ਯੂਟਿਊਬ")) {
                        speakResponse("Opening YouTube");
                        openYouTube();
                        return true;
                    }

                    // 2. WhatsApp
                    if (text.contains("whatsapp") || text.contains("whats app") || text.contains("watsapp")
                            || text.contains("واٹس ایپ") || text.contains("واٹس اپ") || text.contains("واٹساپ") || text.contains("ਵਟਸਐਪ")) {
                        speakResponse("Opening WhatsApp");
                        launchPackage("com.whatsapp");
                        return true;
                    }

                    // 3. Messages / SMS
                    if (text.contains("message") || text.contains("messages") || text.contains("sms") || text.contains("inbox")
                            || text.contains("میسج") || text.contains("میسجز") || text.contains("پیغام") || text.contains("سنیہے")
                            || text.contains("سنیہا") || text.contains("ایس ایم ایس") || text.contains("ਮੈਸੇਜ") || text.contains("ਸੁਨੇਹੇ")) {
                        speakResponse("Opening Messages");
                        openMessages();
                        return true;
                    }

                    // 4. Camera
                    if (text.contains("camera") || text.contains("photo") || text.contains("picture")
                            || text.contains("کیمرہ") || text.contains("کیمرا") || text.contains("تصویر") || text.contains("فوٹو") || text.contains("ਕੈਮਰਾ")) {
                        speakResponse("Opening Camera");
                        openCamera();
                        return true;
                    }

                    // 5. Phone / Call
                    if (text.contains("dialer") || text.contains("phone") || text.contains("call")
                            || text.contains("فون") || text.contains("کال") || text.contains("ڈائلر") || text.contains("ਕਾਲ")) {
                        speakResponse("Opening Phone");
                        openDialer();
                        return true;
                    }

                    // 6. Browser / Chrome
                    if (text.contains("chrome") || text.contains("browser") || text.contains("google") || text.contains("internet")
                            || text.contains("کروم") || text.contains("گوگل") || text.contains("براؤزر") || text.contains("انٹرنیٹ") || text.contains("ਕ੍ਰੋਮ")) {
                        speakResponse("Opening Browser");
                        openBrowser();
                        return true;
                    }

                    // 7. Facebook
                    if (text.contains("facebook") || text.contains("face book") || text.contains("fb")
                            || text.contains("فیس بک") || text.contains("فیسبک") || text.contains("ਫੇਸਬੁੱਕ")) {
                        speakResponse("Opening Facebook");
                        openFacebook();
                        return true;
                    }

                    // 8. Settings
                    if (text.contains("setting") || text.contains("settings") || text.contains("سیٹنگ") || text.contains("سیٹنگز") || text.contains("ਸੈਟਿੰਗ")) {
                        speakResponse("Opening Settings");
                        openSettings();
                        return true;
                    }

                    // 9. Gallery
                    if (text.contains("gallery") || text.contains("photos") || text.contains("گیلری") || text.contains("تصاویر") || text.contains("ਗੈلری")) {
                        speakResponse("Opening Gallery");
                        openGallery();
                        return true;
                    }

                    // 10. Flashlight / Torch
                    if (text.contains("torch") || text.contains("flashlight") || text.contains("light")
                            || text.contains("ٹارچ") || text.contains("لائٹ") || text.contains("بتی")) {
                        toggleTorch();
                        return true;
                    }

                    speakResponse("Ji, main sun raha hoon");
                    return true;
                }

                return false;
            }

            private void openYouTube() {
                restoreAudioVolume();
                Intent intent = getPackageManager().getLaunchIntentForPackage("com.google.android.youtube");
                if (intent == null) {
                    intent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com"));
                }
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openMessages() {
                restoreAudioVolume();
                Intent intent = null;
                try {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                        String defaultSms = Telephony.Sms.getDefaultSmsPackage(this);
                        if (defaultSms != null) {
                            intent = getPackageManager().getLaunchIntentForPackage(defaultSms);
                        }
                    }
                } catch (Exception ignored) {}

                if (intent == null) {
                    intent = new Intent(Intent.ACTION_MAIN);
                    intent.addCategory(Intent.CATEGORY_APP_MESSAGING);
                }
                if (intent.resolveActivity(getPackageManager()) == null) {
                    intent = new Intent(Intent.ACTION_VIEW);
                    intent.setData(Uri.parse("sms:"));
                }
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openCamera() {
                restoreAudioVolume();
                Intent intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openDialer() {
                restoreAudioVolume();
                Intent intent = new Intent(Intent.ACTION_DIAL);
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openBrowser() {
                restoreAudioVolume();
                Intent intent = getPackageManager().getLaunchIntentForPackage("com.android.chrome");
                if (intent == null) {
                    intent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com"));
                }
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openFacebook() {
                restoreAudioVolume();
                Intent intent = getPackageManager().getLaunchIntentForPackage("com.facebook.katana");
                if (intent == null) {
                    intent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.facebook.com"));
                }
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openSettings() {
                restoreAudioVolume();
                Intent intent = new Intent(Settings.ACTION_SETTINGS);
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void openGallery() {
                restoreAudioVolume();
                Intent intent = new Intent(Intent.ACTION_VIEW);
                intent.setType("image/*");
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try {
                    startActivity(intent);
                } catch (Exception ignored) {}
            }

            private void toggleTorch() {
                try {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                        CameraManager cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                        String cameraId = cm.getCameraIdList()[0];
                        isTorchOn = !isTorchOn;
                        cm.setTorchMode(cameraId, isTorchOn);
                        speakResponse(isTorchOn ? "Torch On" : "Torch Off");
                    }
                } catch (Exception ignored) {}
            }

            private void launchPackage(String packageName) {
                restoreAudioVolume();
                Intent launchIntent = getPackageManager().getLaunchIntentForPackage(packageName);
                if (launchIntent != null) {
                    launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    startActivity(launchIntent);
                }
            }

            private Notification createNotification() {
                return new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setContentTitle("Buddy Assistant Active")
                        .setContentText("Listening silently in background...")
                        .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                        .setPriority(NotificationCompat.PRIORITY_LOW)
                        .setOngoing(true)
                        .build();
            }

            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                            CHANNEL_ID,
                            "Buddy Voice Service",
                            NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) manager.createNotificationChannel(channel);
                }
            }

            @Override public int onStartCommand(Intent intent, int flags, int startId) { return START_STICKY; }

            @Override
            public void onDestroy() {
                restoreAudioVolume();
                if (speechRecognizer != null) {
                    speechRecognizer.destroy();
                }
                if (tts != null) {
                    tts.stop();
                    tts.shutdown();
                }
                super.onDestroy();
            }

            @Override public IBinder onBind(Intent intent) { return null; }
        }
        EOF_SERVICE

        # 8. Resources
        cat << 'EOF_LAYOUT' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:gravity="center"
            android:orientation="vertical"
            android:padding="24dp">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Buddy Voice Assistant"
                android:textSize="24sp"
                android:textStyle="bold"
                android:layout_marginBottom="16dp" />
            <TextView
                android:id="@+id/statusTextView"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Status: Ready to activate"
                android:textSize="16sp"
                android:layout_marginBottom="24dp" />
            <Button
                android:id="@+id/startServiceButton"
                android:layout_width="match_parent"
                android:layout_height="60dp"
                android:text="START 24/7 BUDDY ASSISTANT" />
        </LinearLayout>
        EOF_LAYOUT

        cat << 'EOF_STRINGS' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Buddy Assistant</string>
        </resources>
        EOF_STRINGS

        cat << 'EOF_THEMES' > app/src/main/res/values/styles.xml
        <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                <item name="colorPrimary">#6200EE</item>
                <item name="colorPrimaryDark">#3700B3</item>
                <item name="colorAccent">#03DAC5</item>
            </style>
        </resources>
        EOF_THEMES

    - name: Build APK with Gradle
      run: |
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Buddy-VoiceControl-APK
        path: app/build/outputs/apk/debug/*.apk
